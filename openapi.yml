openapi: 3.0.1
info:
  title: "Arcadia Editions - Product Catalog"
  version: "0.0.0"
  description: "Arcadia Editions - Product Catalog"
  contact:
    email: email@domain.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - description: API
    url: /api
  - description: custom
    url: "{protocol}://{server}/{path}"
    variables:
      protocol:
        enum: ['http', 'https']
        default: 'http'
      server:
        default: 'localhost:8080'
      path:
        default: 'api'
tags:
  - name: "Default"
    description: "Operations that are not assigned to a service."
  - name: "ProductCatalog"
    description: "Create, update, publish, and retire products."


paths:
  /products:
    post:
      operationId: createProduct
      description: "createProduct"
      summary: "createProduct"
      tags: [ProductCatalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: "Invalid request"
  /products/{id}:
    put:
      operationId: updateProduct
      description: "updateProduct"
      summary: "updateProduct"
      tags: [ProductCatalog]
      parameters:
        - name: "id"
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInput"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: "Invalid request"
  /products/{id}/publish:
    post:
      operationId: publishProduct
      description: "publishProduct"
      summary: "publishProduct"
      tags: [ProductCatalog]
      parameters:
        - name: "id"
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: "Invalid request"
  /products/{id}/retire:
    post:
      operationId: retireProduct
      description: "retireProduct"
      summary: "retireProduct"
      tags: [ProductCatalog]
      parameters:
        - name: "id"
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: "Invalid request"

components:
  schemas:
    CreateProductInput:
      type: "object"
      x-business-entity: "CreateProductInput"
      required:
      - "sku"
      - "name"
      - "price"
      - "currency"
      - "editionSize"
      - "trackingMode"
      properties:
        sku:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
        price:
          type: "number"
          format: "double"
        currency:
          type: "string"
        editionSize:
          type: "integer"
          format: "int32"
        trackingMode:
          $ref: "#/components/schemas/InventoryTrackingMode"
        launchAt:
          type: "string"
          format: "date-time"
    UpdateProductInput:
      type: "object"
      x-business-entity: "UpdateProductInput"
      properties:
        name:
          type: "string"
        description:
          type: "string"
        price:
          type: "number"
          format: "double"
        currency:
          type: "string"
        launchAt:
          type: "string"
          format: "date-time"
    Product:
      type: "object"
      x-business-entity: "Product"
      required:
      - "sku"
      - "name"
      - "price"
      - "currency"
      - "editionSize"
      - "trackingMode"
      - "status"
      properties:
        id:
          type: "integer"
          format: "int64"
          readOnly: true
        version:
          type: "integer"
          default: "null"
          description: "Version of the document (required in PUT for concurrency control,\
            \ should be null in POSTs)."
        sku:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
        price:
          type: "number"
          format: "double"
        currency:
          type: "string"
        editionSize:
          type: "integer"
          format: "int32"
        trackingMode:
          $ref: "#/components/schemas/InventoryTrackingMode"
        launchAt:
          type: "string"
          format: "date-time"
        status:
          $ref: "#/components/schemas/ProductStatus"
    ProductStatus:
      type: "string"
      x-business-entity: "ProductStatus"
      enum:
      - "DRAFT"
      - "PUBLISHED"
      - "RETIRED"
    InventoryTrackingMode:
      type: "string"
      x-business-entity: "InventoryTrackingMode"
      enum:
      - "QUANTITY"
      - "SERIALIZED"

  securitySchemes:
    basicAuth:     # <-- arbitrary name for the security scheme
      type: http
      scheme: basic
    bearerAuth:     # <-- arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT    # optional, arbitrary value for documentation purposes
security:
  - basicAuth: []  # <-- use the same name here
  - bearerAuth: []  # <-- use the same name here
